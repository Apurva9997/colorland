<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff3e4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Colorland" />
    <title>Page not found — Colorland</title>
    <meta name="description" content="This page is missing. Head back to Colorland to color pictures." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='14' width='64' height='64' fill='%23FFD166'/%3E%3Cpath d='M18 48 L28 12 L36 12 L26 48Z' fill='%23FF6B6B'/%3E%3Cpath d='M30 48 L40 12 L48 12 L38 48Z' fill='%235EC8E3'/%3E%3C/svg%3E" />
    <style>
      :root {
        --ink: #2b2430;
        --paper: #fffdf8;
        --muted: #6d6475;
        --coral: #ff6b6b;
        --sun: #ffd166;
        --sky: #5ec8e3;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        font-family: "Nunito", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse at 8% -10%, #ffe08a 0%, transparent 42%),
          radial-gradient(ellipse at 92% 0%, #ffb7d5 0%, transparent 44%),
          radial-gradient(ellipse at 10% 100%, #9ae6e0 0%, transparent 46%),
          radial-gradient(ellipse at 90% 100%, #c5f0a8 0%, transparent 42%),
          #fff3e4;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 18px;
      }

      .card {
        width: min(440px, 100%);
        background: var(--paper);
        border: 4px solid var(--ink);
        border-radius: 28px;
        box-shadow: 8px 10px 0 rgba(43, 36, 48, 0.18);
        padding: 32px 28px 28px;
        text-align: center;
      }

      .logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: #fff;
        border: 3px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        display: grid;
        place-items: center;
        margin: 0 auto 16px;
      }

      .logo svg {
        width: 44px;
        height: 44px;
      }

      h1 {
        font-family: "Baloo 2", "Nunito", sans-serif;
        font-size: clamp(1.8rem, 5vw, 2.4rem);
        line-height: 1.1;
        letter-spacing: 0.02em;
      }

      p {
        margin-top: 10px;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--muted);
      }

      .home-btn {
        display: inline-block;
        margin-top: 22px;
        border: 3px solid var(--ink);
        background: var(--sun);
        color: var(--ink);
        border-radius: 16px;
        padding: 12px 22px;
        font-family: inherit;
        font-weight: 800;
        font-size: 1.05rem;
        text-decoration: none;
        box-shadow: 3px 3px 0 var(--ink);
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }

      .home-btn:hover {
        transform: translate(-1px, -1px);
        box-shadow: 4px 4px 0 var(--ink);
      }

      .home-btn:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--ink);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="10" width="14" height="44" rx="4" fill="#ff6b6b" stroke="#2b2430" stroke-width="3" />
          <rect x="25" y="6" width="14" height="48" rx="4" fill="#ffd166" stroke="#2b2430" stroke-width="3" />
          <rect x="42" y="14" width="14" height="40" rx="4" fill="#5ec8e3" stroke="#2b2430" stroke-width="3" />
        </svg>
      </div>
      <h1>Oops! This page is missing.</h1>
      <p>We looked under the crayons, but this page is not here. Let’s go back and color pictures.</p>
      <a class="home-btn" href="/">Back to Colorland</a>
    </main>
  </body>
</html>
